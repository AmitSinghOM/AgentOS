global:
  scrape_interval: 5s

scrape_configs:
  - job_name: agentos-api
    metrics_path: /metrics
    static_configs:
      # The API and worker run on the host in the quick start; inside compose use the
      # service names. Both are scraped: the API sees run.started, the worker sees the
      # rest, and each process keeps its own registry.
      - targets: ["host.docker.internal:8000", "host.docker.internal:8001"]
