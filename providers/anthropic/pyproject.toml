[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-provider-anthropic"
version = "0.9.0"
description = "AgentOS executor for the Anthropic Messages API wire format (Anthropic, and Ollama's /v1/messages) over plain HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "agentos-durable[providerkit]>=0.9,<1.0",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/AmitSinghOM/AgentOS"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."agentos.executors"]
anthropic = "agentos_provider_anthropic:load"

[tool.setuptools]
packages = ["agentos_provider_anthropic"]

[tool.setuptools.package-data]
agentos_provider_anthropic = ["pricing.json"]
