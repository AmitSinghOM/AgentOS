[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-provider-openai-agents"
version = "0.1.0"
description = "AgentOS executor that runs an OpenAI Agents SDK agent as one governed step (inner harness)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "agentos[providerkit]>=0.7,<1.0",
    "openai-agents>=0.22,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.entry-points."agentos.executors"]
openai-agents = "agentos_provider_openai_agents:load"

[tool.setuptools]
packages = ["agentos_provider_openai_agents"]

[tool.setuptools.package-data]
agentos_provider_openai_agents = ["pricing.json"]
