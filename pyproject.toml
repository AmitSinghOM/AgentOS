[project]
# `dagentos` for both the distribution and the import package (`pip install dagentos` →
# `import dagentos`). The product is still AgentOS; the env vars (AGENTOS_*), the `agentos` CLI,
# the `agentos.executors` entry-point group and the image name keep the product name. History:
# v0.9.0–v0.10.0 published as `agentos-durable` with import package `agentos`, because
# `agentos` on PyPI belongs to agentos.org and `agenticos` to another project — both with the
# same import names. `dagentos` was free on PyPI and npm on 2026-09-20 (docs/RELEASING.md).
name = "dagentos"
version = "0.11.0"
description = "A control plane for durable, observable, human-in-the-loop LLM agent workflows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["agents", "durable-execution", "event-sourcing", "llm", "workflow", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "httpx>=0.27",            # built-in `tool` agent (dagentos.agents.tool); the core never imports it
]

[project.urls]
Homepage = "https://github.com/AmitSinghOM/AgentOS"
Repository = "https://github.com/AmitSinghOM/AgentOS"
Changelog = "https://github.com/AmitSinghOM/AgentOS/releases"
Documentation = "https://github.com/AmitSinghOM/AgentOS/blob/main/README.md"

[project.scripts]
agentos = "dagentos.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "import-linter>=2.0"]
# Observability adapters (docs/DEVELOPMENT_STRUCTURE.md §11 A9). The core never imports
# these; dagentos.observability does, and only when the extra is installed.
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
    "prometheus-client>=0.20",
]
# Shared toolkit for provider plugins (dagentos.providerkit): cassettes, pricing, errors,
# prompt templates. The core never imports it; the agentos-provider-* distributions do.
providerkit = ["httpx>=0.27", "jsonschema>=4.20,<5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# The provider's tests live with the provider (its own distribution) but run from the
# root too; they importorskip when the provider is not installed.
testpaths = ["tests", "providers/openai-compat/tests", "providers/anthropic/tests",
             "providers/openai-agents/tests", "providers/pydantic-ai/tests"]
markers = [
    "network: needs real Postgres + Toxiproxy (tests/chaos/network); skipped without AGENTOS_TEST_PG_DSN",
]

# Layering contract (docs/DEVELOPMENT_STRUCTURE.md §1). `lint-imports` runs in CI;
# a PR that makes the core depend on an adapter or an SDK fails.
[tool.importlinter]
root_package = "dagentos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core depends on nothing inside dagentos"
type = "forbidden"
source_modules = ["dagentos.core"]
forbidden_modules = [
    "dagentos.api",
    "dagentos.store",
    "dagentos.agents",
    "dagentos.observability",
    "dagentos.plugins",
    "dagentos.providerkit",
]

[[tool.importlinter.contracts]]
name = "core imports no framework or vendor SDK"
type = "forbidden"
source_modules = ["dagentos.core"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn",
    "sqlalchemy", "psycopg", "redis",
    "openai", "anthropic", "boto3", "botocore",
    "opentelemetry", "prometheus_client",
    "httpx", "agentos_provider_openai_compat",   # providers are plugins (§2.2)
    "jsonschema", "referencing",                  # typed output lives in the kit, not the core
    "agents", "agentos_provider_openai_agents",  # the inner harnesses are plugins too
    "pydantic_ai", "agentos_provider_pydantic_ai",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "adapters do not import each other"
type = "independence"
modules = ["dagentos.store", "dagentos.agents", "dagentos.observability"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The distribution and the import package are both `dagentos`; hatch is still told explicitly
# what to ship. The sdist is the source of exactly what the wheel contains plus what a
# rebuilder needs — not the compose stack, CI, tests or provider trees (published separately).
[tool.hatch.build.targets.wheel]
packages = ["dagentos"]

[tool.hatch.build.targets.sdist]
include = ["/dagentos/**", "/README.md", "/LICENSE", "/pyproject.toml", "/examples/*.json"]
exclude = ["**/__pycache__", "**/*.pyc"]

# The operator UI bundle is built by Node (ui/) and copied to dagentos/_ui by
# scripts/bundle_ui.py before `python -m build`. It is gitignored, so hatch would drop it;
# `artifacts` includes it anyway. A release build without it fails scripts/release_smoke.py.
[tool.hatch.build]
artifacts = ["dagentos/_ui/**"]
