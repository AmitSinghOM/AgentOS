[project]
name = "agentos"
version = "0.8.1"
description = "A control plane for durable, observable, human-in-the-loop LLM agent workflows"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "httpx>=0.27",            # built-in `tool` agent (agentos.agents.tool); the core never imports it
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "import-linter>=2.0"]
# Observability adapters (docs/DEVELOPMENT_STRUCTURE.md §11 A9). The core never imports
# these; agentos.observability does, and only when the extra is installed.
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
    "prometheus-client>=0.20",
]
# Shared toolkit for provider plugins (agentos.providerkit): cassettes, pricing, errors,
# prompt templates. The core never imports it; the agentos-provider-* distributions do.
providerkit = ["httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# The provider's tests live with the provider (its own distribution) but run from the
# root too; they importorskip when the provider is not installed.
testpaths = ["tests", "providers/openai-compat/tests", "providers/anthropic/tests",
             "providers/openai-agents/tests", "providers/pydantic-ai/tests"]
markers = [
    "network: needs real Postgres + Toxiproxy (tests/chaos/network); skipped without AGENTOS_TEST_PG_DSN",
]

# Layering contract (docs/DEVELOPMENT_STRUCTURE.md §1). `lint-imports` runs in CI;
# a PR that makes the core depend on an adapter or an SDK fails.
[tool.importlinter]
root_package = "agentos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core depends on nothing inside agentos"
type = "forbidden"
source_modules = ["agentos.core"]
forbidden_modules = [
    "agentos.api",
    "agentos.store",
    "agentos.agents",
    "agentos.observability",
    "agentos.plugins",
    "agentos.providerkit",
]

[[tool.importlinter.contracts]]
name = "core imports no framework or vendor SDK"
type = "forbidden"
source_modules = ["agentos.core"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn",
    "sqlalchemy", "psycopg", "redis",
    "openai", "anthropic", "boto3", "botocore",
    "opentelemetry", "prometheus_client",
    "httpx", "agentos_provider_openai_compat",   # providers are plugins (§2.2)
    "agents", "agentos_provider_openai_agents",  # the inner harnesses are plugins too
    "pydantic_ai", "agentos_provider_pydantic_ai",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "adapters do not import each other"
type = "independence"
modules = ["agentos.store", "agentos.agents", "agentos.observability"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
