# Dependency update automation (production pass 2, A3). Weekly, grouped so a routine
# minor/patch sweep is one PR per ecosystem; majors arrive on their own so they get read.
# A major that is deliberately held back should be closed with a dated reason in the
# ROADMAP, not left to reopen every week.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/anthropic"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/openai-agents"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/openai-compat"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/pydantic-ai"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
