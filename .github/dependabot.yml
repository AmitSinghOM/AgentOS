# Dependency update automation (production pass 2, A3). Weekly, grouped so a routine
# minor/patch sweep is one PR per ecosystem; majors arrive on their own so they get read.
# A major that is deliberately held back should be closed with a dated reason in the
# ROADMAP, not left to reopen every week.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/anthropic"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/openai-agents"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/openai-compat"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/pydantic-ai"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/acp"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/providers/mcp"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
  # Audit I-21: the Dockerfile pins python:3.12-slim by digest; without this ecosystem the
  # digest only ever moved by hand (last 2026-09-20).
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    # The image tracks python:3.12-slim on purpose: deploy/constraints.txt is hash-compiled
    # for 3.12 and CI tests 3.11 and 3.14. Only digest/patch moves of that tag are automatic;
    # a minor or major bump is a release decision (see docs/RELEASING.md).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      docker-patch:
        update-types: ["patch"]
