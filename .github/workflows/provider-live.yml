# Nightly opt-in: re-record the provider cassettes against a LIVE model server and prove
# the replay tests still pass on fresh recordings (docs/DEVELOPMENT_STRUCTURE.md §11 A10).
#
# Uses Ollama with qwen2.5:0.5b on the runner — free, no API key, no vendor account. The
# recordings are uploaded as an artifact, never committed automatically: a human looks at
# the diff and opens a PR. If this job fails for 30 days, the provider README marks the
# plugin `deprecated`; the core is unaffected.
#
# The function-calling round trip (ROADMAP A8, #148) runs LIVE here too, on a second, larger
# model: qwen2.5:0.5b never emits a tool call (0/3 on the quickstart phrase, measured
# 2026-11-18 on Ollama 0.40.16), qwen2.5:1.5b does (3/3; 9/10 on
# providers/openai-compat/scripts/probe_tool_boundary.py). The live cassette
# `tool_round_trip_live.json` is re-recorded from that model and uploaded with the rest.
name: provider-live
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to record against"
        default: "qwen2.5:0.5b"
      model_tools:
        description: "Ollama model for the live function-calling round trip (must emit tool calls)"
        default: "qwen2.5:1.5b"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Same install line as ci.yml's `test` job: every provider, so the replay step below
      # exercises all five suites (each importorskips when its distribution is absent).
      - run: pip install -e ".[dev,observability,providerkit]" -e providers/openai-compat -e providers/anthropic -e providers/openai-agents -e providers/pydantic-ai -e providers/acp
      - name: Install and start Ollama
        # Audit I-22: `curl ... | sh` ran whatever ollama.com served that night. The installer
        # is now fetched to a file and checked against a recorded sha256 before it runs; when
        # Ollama changes the script this step fails closed and the hash below must be re-recorded
        # (`curl -fsSL -o install.sh https://ollama.com/install.sh && sha256sum install.sh`).
        # The operator-supplied model name reaches the shell only through `env:`, never by
        # expression substitution inside `run:` (script-injection shape).
        env:
          OLLAMA_INSTALL_SHA256: "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f"  # recorded 2026-11-17
          MODEL: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
        run: |
          set -euo pipefail
          curl -fsSL -o install.sh https://ollama.com/install.sh
          echo "$OLLAMA_INSTALL_SHA256  install.sh" | sha256sum -c -
          sh install.sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/v1/models && break; sleep 2; done
          ollama pull "$MODEL"
      - name: Live function-calling round trip on the runner's Ollama (the tool path, for real)
        # Closes the second gap from #148: the tool tests below replay recordings, so a
        # real-model regression in the tool path had no nightly to fail. One extra pull;
        # the model name reaches the shell only through `env:`, as above.
        env:
          TOOL_MODEL: ${{ github.event.inputs.model_tools || 'qwen2.5:1.5b' }}
          AGENTOS_LIVE_TOOLS: "1"
        run: |
          set -euo pipefail
          ollama pull "$TOOL_MODEL"
          export AGENTOS_OPENAI_ALIASES="{\"chat.default\": \"$TOOL_MODEL\"}"
          pytest -q providers/openai-compat/tests -k live_tool -p no:cacheprovider
      - name: Re-record cassettes against the live server (both wire formats)
        env:
          MODEL: ${{ github.event.inputs.model || 'qwen2.5:0.5b' }}
          TOOL_MODEL: ${{ github.event.inputs.model_tools || 'qwen2.5:1.5b' }}
        run: |
          set -euo pipefail
          export AGENTOS_OPENAI_ALIASES="{\"chat.fast\": \"$MODEL\"}"
          export AGENTOS_ANTHROPIC_ALIASES="{\"chat.fast\": \"$MODEL\"}"
          python providers/openai-compat/scripts/record_cassettes.py --live
          python providers/anthropic/scripts/record_cassettes.py --live
          # The live tool cassette comes from the tool model (the quickstart agent's
          # `chat.default`); the scripted `tool_round_trip.json` stays as committed.
          AGENTOS_OPENAI_ALIASES="{\"chat.default\": \"$TOOL_MODEL\"}" \
            python providers/openai-compat/scripts/record_cassettes.py --tools --live
      - name: Replay tests pass on the fresh recordings; every other provider suite runs too
        # Audit I-11: this job used to replay only openai-compat and anthropic, so a floor
        # drift in pydantic-ai, openai-agents or acp had no nightly to fail. Includes the
        # replay of the just-recorded tool_round_trip_live.json.
        run: pytest -q providers tests/test_quickstart_llm.py -p no:cacheprovider
      - name: Show what changed
        run: git -P diff --stat -- providers/*/tests/cassettes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassettes-${{ github.run_id }}
          path: providers/*/tests/cassettes
