name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "dagentos/**"
      - "providers/**"
      - "ui/**"
      - "tests/**"
      - "examples/**"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "Dockerfile"
      - "scripts/release_smoke.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Phase 8 #10: the fresh-tree install gate. Build every distribution exactly as
    # publish.yml does, twine-check it, install the wheels into an empty venv and run the
    # same smoke a stranger's `pip install` would face — on every PR, not only on a tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the operator UI into the package
        run: |
          set -euo pipefail
          (cd ui && npm ci --no-audit --no-fund && npm run build)
          python scripts/bundle_ui.py
      - run: pip install build==1.2.2.post1 twine==7.0.0 packaging==26.3
      - run: |
          set -euo pipefail
          python -m build --outdir dist .
          for p in providers/*/; do python -m build --outdir dist "$p"; done
          python -m twine check --strict dist/*
      - run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet "$(ls dist/dagentos-*.whl)[providerkit]" dist/agentos_provider_*.whl
          /tmp/smoke/bin/agentos --help > /dev/null
          /tmp/smoke/bin/python scripts/release_smoke.py "$version"

  ui:
    # Phase 9: the operator UI. Type-check, component tests (Vitest + Testing Library, fetch
    # stubbed), production build; then the Python mount tests run against a REAL bundle so the
    # SPA fallback and the auth exemption are proven on what ships, not a fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: AGENTOS_UI_DIR="$PWD/ui/dist" pytest -q tests/test_ui_mount.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor we promise and the newest interpreter we develop on
        # (docs/DEVELOPMENT_STRUCTURE.md §4). Both must stay green.
        python: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
          POSTGRES_DB: agentos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentos" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      # Enables the Postgres leg of tests/contract/ (skipped when unset).
      AGENTOS_TEST_PG_DSN: postgresql://agentos:agentos@localhost:5432/agentos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,observability,providerkit]" -e providers/openai-compat -e providers/anthropic -e providers/openai-agents -e providers/pydantic-ai
      - run: ruff check .
      - run: lint-imports
      - run: pytest -q --ignore=tests/chaos
      - run: pytest -q tests/contract -k postgres --no-header -rN | tail -1

  audit:
    # Production pass 2, A3: a known-vulnerable dependency fails the PR instead of shipping.
    # Audits the RESOLVED environment (what `pip install` actually picks under our floors),
    # not the floors themselves; `--strict` also fails on packages the index cannot assess.
    # The five local editable projects are excluded at the freeze, not via `--skip-editable`:
    # under `--strict` a skipped distribution IS a failure (the first run of this job proved
    # it: "agentos-provider-anthropic: distribution marked as editable", exit 1). `--no-deps`
    # audits exactly the frozen pins without re-resolving.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip   # setup-python's pip carries open PYSEC advisories
      - run: pip install -e ".[dev,observability,providerkit]" -e providers/openai-compat -e providers/anthropic -e providers/openai-agents -e providers/pydantic-ai
      - run: pip install pip-audit==2.10.1
      - run: pip freeze --exclude-editable > /tmp/resolved.txt
      - run: pip-audit --strict --no-deps --progress-spinner off -r /tmp/resolved.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ui
      - run: npm audit --audit-level=high
        working-directory: ui

  chaos:
    # Layer 1 fault points + the real-process kill -9 demo (ROADMAP → Chaos engineering
    # plan). Separate job so the evidence for "no step runs twice" is a named check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v tests/chaos --ignore=tests/chaos/network

  chaos-network:
    # Layer 2: Toxiproxy between the worker and Postgres. The lease-expiry race must end
    # with the stale worker FENCED, never merged.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos
          POSTGRES_DB: agentos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentos" --health-interval 5s
          --health-timeout 3s --health-retries 10
      toxiproxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0
        ports: ["8474:8474", "15432:15432"]
    env:
      AGENTOS_TEST_PG_DSN: postgresql://agentos:agentos@127.0.0.1:5432/agentos_test
      AGENTOS_TEST_TOXIPROXY_API: http://127.0.0.1:8474
      # Inside the toxiproxy container, Postgres is reachable by its service name.
      AGENTOS_TEST_TOXIPROXY_UPSTREAM: postgres:5432
      AGENTOS_TEST_TOXIPROXY_LISTEN: 0.0.0.0:15432
      AGENTOS_TEST_TOXIPROXY_CLIENT: 127.0.0.1:15432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -v tests/chaos/network -rs

  compose:
    # Phase 0 gate: `docker compose up` brings up Postgres and the observability stack; all pass
    # their healthchecks. The API does not talk to them until Phase 1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait --wait-timeout 90
      - run: docker compose exec -T postgres pg_isready -U agentos
      # The UIs have no compose healthcheck, so `--wait` returns before they listen;
      # retry briefly instead of failing the release gate on a connection reset.
      - run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:16686/ > /dev/null      # jaeger UI up
      - run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:9090/-/ready               # prometheus ready
      - run: curl -fsS --retry 10 --retry-all-errors --retry-delay 2 http://localhost:3000/api/health | grep -q ok  # grafana up
      - if: always()
        run: docker compose down -v
